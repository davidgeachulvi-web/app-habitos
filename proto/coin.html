<style>

    .sec-btn {

        border: 1px solid rgba(255, 255, 255, 0.14);

        font-size: 11px; font-weight: 600; letter-spacing: 0.14em;
        padding: 7px 15px; border-radius: 999px;

    .sec-btn:hover:not(.active) { background: rgba(255, 255, 255, 0.12); }

    #studio-toggle {

        z-index: 4; pointer-events: auto; cursor: pointer;
        background: rgba(255, 255, 255, 0.08);

    #studio-panel {

    #studio-panel.open { transform: translateX(0); opacity: 1; pointer-events: auto; }
    #studio-panel h3 {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './js/vendor/OrbitControls.js';
import { SVGLoader } from './js/vendor/SVGLoader.js';
import { GLTFExporter } from './js/vendor/GLTFExporter.js';
import { GLTFLoader } from './js/vendor/GLTFLoader.js';
import { DRACOLoader } from './js/vendor/DRACOLoader.js';
import { makeStudioEnv } from './js/badges/coin-studio.js';
import { RoomEnvironment } from './js/vendor/RoomEnvironment.js';

// ---------- Renderer ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true,
    powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(stage.clientWidth, stage.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
// Gestión de color explícita (aviso 5): salida en sRGB, tone mapping ACES.
// Los colores de material se declaran en sRGB y three los convierte a lineal
// automáticamente (ColorManagement); los datos (roughness/metalness/normales)
// son escalares, no colores, y se mantienen en espacio lineal.
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.88;
stage.appendChild(renderer.domElement);

// ---------- Escena y cámara ----------
const scene = new THREE.Scene();
let shadowDisc = null;
let coinGroup = null;
const camera = new THREE.PerspectiveCamera(35, stage.clientWidth / stage.clientHeight, 0.1, 100);

const POLAR = THREE.MathUtils.degToRad(75);
const AZIMUTH = THREE.MathUtils.degToRad(45);
const DIST = 5.0;
function setCameraView() {
    camera.position.set(
        DIST * Math.sin(POLAR) * Math.sin(AZIMUTH),
        DIST * Math.cos(POLAR),
        DIST * Math.sin(POLAR) * Math.cos(AZIMUTH)
    );
    camera.lookAt(0, 0, 0);
}
setCameraView();

// ---------- Estudio (definido antes del entorno) ----------
const STUDIO = {
    exposure: 0.76,
    key: 1.18,
    fill: 0.38,
    rakeF: 3.35,
    rakeB: 2.35,
    rim: 0.22,
    hemi: 0.07,
    envMul: 0.74,
    frontBoost: 0.50,
    sideBoost: 1.05,
    ceilingBoost: 0.88,
    floorBoost: 1.30,
    shadow: true,
    shadowOpacity: 0.32,
    fieldRoughnessMul: 1.08,
    reliefRoughnessMul: 1.62,
    reliefEnvMul: 0.70,
    reliefAO: 0.76,
    viewAdaptive: true,
    frontEnvCut: 0.38,
    frontRakeBoost: 1.85,
    frontDetail: 0.62,
    frontCross: 1.05,
    frontKeyCut: 0.42,
    frontFillCut: 0.62,
    lightAz: 58,
    lightEl: 34,
    baseEnv: 0.86
};
STUDIO.baseEnv = 0.86;

// ---------- Entorno de estudio HDRI procedural ----------
let envTexture = null;
let envMode = 'awake';
const pmremGen = new THREE.PMREMGenerator(renderer);

function disposeEnv() {
    if (envTexture) {
        envTexture.dispose();
        envTexture = null;
    }
}

function rebuildEnvironment() {
    disposeEnv();
    if (envMode === 'room') {
        const room = new RoomEnvironment();
        envTexture = pmremGen.fromScene(room, 0.04).texture;
        room.traverse(o => {
            if (o.isMesh) {
                o.geometry.dispose();
                o.material.dispose();
            }
        });
    } else {
        envTexture = makeStudioEnv(renderer, {
            frontBoost: STUDIO.frontBoost,
            sideBoost: STUDIO.sideBoost,
            ceilingBoost: STUDIO.ceilingBoost,
            floorBoost: STUDIO.floorBoost
        });
    }
    scene.environment = envTexture;
    applyStudio();
}

// rebuildEnvironment() se invoca tras definir luces y applyStudio()

const keyLight = new THREE.DirectionalLight(0xfff1dc, 1.0);
keyLight.position.set(3.5, 5, 4);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 16;
keyLight.shadow.camera.left = -2.5;
keyLight.shadow.camera.right = 2.5;
keyLight.shadow.camera.top = 2.5;
keyLight.shadow.camera.bottom = -2.5;
// shadow acne en el canto: normalBias separa el muestreo a lo largo de la
// normal de cada faceta (elimina las autosombras negras de las estrías) y un
// bias negativo pequeño evita el despegue (peter-panning) sin generar parches.
keyLight.shadow.bias = -0.0003;
keyLight.shadow.normalBias = 0.045;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x8fa3ff, 0.35);
fillLight.position.set(-4, 2, -3);
scene.add(fillLight);

// Luz RASANTE (raking light): casi paralela a la cara, proyecta sombra larga en
// los flancos de los grabados (glifo, AWAKE, fecha). Es LA clave para que el
// relieve se lea desde todo ángulo: sin ella, en ángulos de softbox uniforme los
// grabados apenas sombrean y se pierden sobre el campo satinado.
// Luz RASANTE más baja y fuerte: un ángulo casi paralelo a la cara proyecta
// sombra larga y clara en los flancos de los grabados, de modo que glifo, AWAKE
// y fecha se lean en relieve incluso mirando la moneda de frente (donde un
// reflejo uniforme haría desaparecer el detalle). La clave es la elevación baja.
const rakeLight = new THREE.DirectionalLight(0xffffff, 0.9);
rakeLight.position.set(3.4, -0.6, -3.2);  // rasante del reverso, elevación muy baja
scene.add(rakeLight);
const rakeLightBack = new THREE.DirectionalLight(0xffffff, 1.05);
rakeLightBack.position.set(4.8, 0.06, 2.6);
scene.add(rakeLightBack);

// Raking cruzado solo en vista frontal: sombras laterales en glifo / AWAKE / fecha
const rakeCrossL = new THREE.DirectionalLight(0xfff6ec, 0);
rakeCrossL.position.set(-5.2, 0.10, 3.2);
scene.add(rakeCrossL);
const rakeCrossR = new THREE.DirectionalLight(0xfff6ec, 0);
rakeCrossR.position.set(5.2, 0.08, 3.2);
scene.add(rakeCrossR);

const frontDetailLight = new THREE.DirectionalLight(0xfff9f2, 0);
frontDetailLight.position.set(0, 0.3, 6);
scene.add(frontDetailLight);

const hemiLight = new THREE.HemisphereLight(0xdce8ff, 0x1a1410, 0.09);
scene.add(hemiLight);

const rimLight = new THREE.DirectionalLight(0xb8c8e8, 0.28);
rimLight.position.set(-2.5, 1.2, 5.8);
scene.add(rimLight);

const _camDir = new THREE.Vector3();
const _faceFront = new THREE.Vector3();
const _faceBack = new THREE.Vector3();
const _detailOff = new THREE.Vector3();
let studioBaseEnvIntensity = 0.88;

function frontFaceBlend(facing) {
    if (facing <= 0.65) return 0;
    return Math.min(1, (facing - 0.65) / 0.35);
}

const COIN_FIELD_R = 0.84;

/** Desplazamiento Z del campo respecto al plano nominal (anverso: negativo = hundido). */
function computeCenterDishZDisp(r, dishCfg, R_FIELD = COIN_FIELD_R) {
    if (!dishCfg?.depth || !dishCfg?.radius) return 0;
    const R_DISH = Math.min(dishCfg.radius, R_FIELD - 0.02);
    const flatR = R_DISH * (dishCfg.flatRatio ?? 0.68);
    let recess = 0;
    if (r < R_DISH) {
        if (r <= flatR) recess = dishCfg.depth;
        else {
            const t = 1 - (r - flatR) / (R_DISH - flatR);
            recess = dishCfg.depth * (t * t * (3 - 2 * t));
        }
    }
    const lift = (r > R_DISH + 1e-4 && r <= R_FIELD + 1e-4) ? (dishCfg.fieldLift ?? 0) : 0;
    return -recess + lift;
}

function coinFaceZAtRadius(r, front = true) {
    const H = COIN_CFG.tHeight / 2;
    const d = computeCenterDishZDisp(r, COIN_RELIEF?.centerDish);
    return front ? H + d : -H - d;
}

// ---------- Moneda: UN único sólido de revolución ----------
// El cuerpo integra en una sola malla cerrada: canto dentado (reeded edge) +
// las dos caras + la orla elevada en ambas. Es un sólido continuo (una sola
// superficie exterior, sin piezas sueltas embebidas): el perfil es uniforme en
// las 360° y no hay superficies internas coincidentes que parpadeen (z-fighting)
// según el ángulo de cámara.
// relief: { latheAmp, latheStep, satinAmp } — micro-relieve opcional de la cara.
function buildCoinSolid(cfg) {
    const { ridges, tHeight, radius, groove, relief, faldon, dentado, rim, rimRaise, rimWidth } = cfg;
    const H = tHeight / 2;              // semigrosor (cara en z=±H)
    // Resolución angular optimizada para móvil: 6 segmentos por surco del fresado
    // (la onda del surco es suave, 32/surco era sobreteselado: 230k triángulos).
    // Con 180 surcos → ANG=1080 → ~43k triángulos, silueta idéntica.
    const ANG = Math.max(96, ridges * 6);
    // Factor del fresado del canto con PERFIL SEMICIRCULAR (reeded edge): los
    // surcos se mecanizan como semicírculos equidistantes; cresta=radius,
    // valle=radius-groove con transición circular suave.
    const ridge = (theta) => {

function buildVoidRingGeo() {
    // Espejo vertical (y abajo -> y arriba), identico al pipeline del glifo.
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">' +
        '<g transform="translate(0 32) scale(1 -1)"><path fill="#000" fill-rule="nonzero" d="' + VOID_D + '"/></g></svg>';
    const data = svgLoader.parse(svg);
    const shapes = [];
    for (const p of data.paths) shapes.push(...p.toShapes(true));
    if (!shapes.length) return null;
    const tmp = new THREE.ShapeGeometry(shapes, 16);
    tmp.computeBoundingBox();
    const tb = tmp.boundingBox;
    tmp.translate(-(tb.min.x + tb.max.x) / 2, -(tb.min.y + tb.max.y) / 2, 0);
    let maxR = 0;
    const tp = tmp.attributes.position;
    for (let i = 0; i < tp.count; i++) {
        const r = Math.hypot(tp.getX(i), tp.getY(i));
        if (r > maxR) maxR = r;
    }
    tmp.dispose();
    const s = VOID_OUTER_R / maxR;
    // resolucion propia del anillo: mas curvas y mas bisel para grabar los brazos
    // espirales con suavidad (el glifo conserva glyphOpts/16).
    const opts = Object.assign({}, glyphOpts, {
        bevelSize: 0.004 / s,
        curveSegments: 32,
        bevelSegments: 8
    });
    const g = new THREE.ExtrudeGeometry(shapes, opts);
    g.computeBoundingBox();
    const bb = g.boundingBox;
    g.translate(-(bb.min.x + bb.max.x) / 2, -(bb.min.y + bb.max.y) / 2, 0);
    g.applyMatrix4(new THREE.Matrix4().makeScale(s, s, 1));
    g.translate(0, 0, -g.boundingBox.min.z);
    g.computeVertexNormals();
    bakeReliefAO(g, reliefAOStrength(), 0.54);
    return g;
}

function buildGlyph(sec) {
    // Espejo vertical (y→-y): SVGLoader alimenta las coords y-abajo del SVG a three (y-arriba).
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">' +
        '<g transform="translate(0 256) scale(1 -1)"><path fill="#000" d="' + GLYPHS[sec] + '"/></g></svg>';
    const data = svgLoader.parse(svg);
    const shapes = [];
    for (const p of data.paths) shapes.push(...p.toShapes(true));
    // factor de escala: primero mido maxR en coords SVG (sin extruir) para que el
    // chaflán lateral sea isótropo al pasar a unidades reales (igual al AWAKE).
    const tmp = new THREE.ShapeGeometry(shapes, 16);
    tmp.computeBoundingBox();
    const tb = tmp.boundingBox;
    tmp.translate(-(tb.min.x + tb.max.x) / 2, -(tb.min.y + tb.max.y) / 2, 0);
    let maxR = 0;
    const tp = tmp.attributes.position;
    for (let i = 0; i < tp.count; i++) {
        const r = Math.hypot(tp.getX(i), tp.getY(i));
        if (r > maxR) maxR = r;
    }
    tmp.dispose();
    const s = GLYPH_RADIUS / maxR;
    // bevelSize proporcional: en coords SVG vale realBEVEL/s para que tras escalar
    // XY por s el chaflán lateral quede ~0.004 (mismo acabado que el AWAKE).
    const opts = Object.assign({}, glyphOpts, { bevelSize: 0.004 / s });
    const g = new THREE.ExtrudeGeometry(shapes, opts);
    // centrar en el plano XY
    g.computeBoundingBox();
    const bb = g.boundingBox;
    g.translate(-(bb.min.x + bb.max.x) / 2, -(bb.min.y + bb.max.y) / 2, 0);
    g.applyMatrix4(new THREE.Matrix4().makeScale(s, s, 1));
    g.translate(0, 0, -g.boundingBox.min.z); // base en z=0
    g.computeVertexNormals();
    bakeReliefAO(g, reliefAOStrength(), 0.54);
    return g;
}

function reliefAOStrength() {

function metalMat(color, roughness, env, isRelief, fieldBump) {
    const bump = fieldBump || 0;
    const fieldR = Math.min(0.66, (roughness + bump) * STUDIO.fieldRoughnessMul);
    const reliefR = Math.max(0.26, fieldR * STUDIO.reliefRoughnessMul);
    const r = isRelief ? reliefR : fieldR;
    const e = isRelief ? env * STUDIO.reliefEnvMul : env;
    const mat = new THREE.MeshPhysicalMaterial({
        color, metalness: 1.0, roughness: r, envMapIntensity: e,
        side: THREE.DoubleSide, flatShading: false,
        vertexColors: isRelief
    });
    mat.userData.baseEnv = e;
    return mat;
}
// Hornea AO suave en la base de un relieve extruido: oscurece la franja donde la
// pared del grabado se encuentra con el campo (profunidad óptica), dejando la cima
// clara. Se escribe como atributo de color por vértice (multiplica el albedo del
// material de relieve, que tiene vertexColors activado).
function bakeReliefAO(geo, strength = 0.55, reach = 0.45) {
    const pos = geo.attributes.position;
    const nor = geo.attributes.normal;
    if (!pos || !nor) return;
    const colors = new Float32Array(pos.count * 3);
    let zMin = Infinity, zMax = -Infinity;
    for (let i = 0; i < pos.count; i++) {
        const z = pos.getZ(i); if (z < zMin) zMin = z; if (z > zMax) zMax = z;
    }
    const dz = Math.max(1e-6, zMax - zMin);
    for (let i = 0; i < pos.count; i++) {
        const h = (pos.getZ(i) - zMin) / dz;            // 0 = base (campo) → 1 = cima
        const nz = Math.abs(nor.getZ(i));                // 1 = tapa horizontal, 0 = pared
        const wall = Math.max(0, 1 - nz);
        const fall = smoothstep01(1 - reach, 1, h);      // 0 abajo → 1 arriba
        const ao = 1 - strength * wall * (1 - fall);     // paredes bajas más oscuras
        colors[i * 3] = colors[i * 3 + 1] = colors[i * 3 + 2] = ao;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
}
function smoothstep01(e0, e1, x) {
    const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
    return t * t * (3 - 2 * t);
}

function applyViewAdaptiveLighting() {
    if (!coinGroup) return;
    const baseKey = STUDIO.key;
    const baseFill = STUDIO.fill;

    function resetDirectLights() {
        keyLight.intensity = baseKey;
        fillLight.intensity = baseFill;
        rakeLightBack.intensity = STUDIO.rakeF;
        rakeLight.intensity = STUDIO.rakeB;
        rakeCrossL.intensity = 0;
        rakeCrossR.intensity = 0;
        frontDetailLight.intensity = 0;
        scene.environmentIntensity = studioBaseEnvIntensity;
    }

    if (!STUDIO.viewAdaptive) {
        resetDirectLights();
        return;
    }

    camera.getWorldDirection(_camDir);
    _faceFront.set(0, 0, 1).applyQuaternion(coinGroup.quaternion);
    _faceBack.set(0, 0, -1).applyQuaternion(coinGroup.quaternion);
    const facingFront = Math.abs(_camDir.dot(_faceFront));
    const facingBack = Math.abs(_camDir.dot(_faceBack));

    let t = 0;
    let onFront = false;
    if (facingFront >= facingBack && facingFront > 0.65) {
        t = frontFaceBlend(facingFront);
        onFront = true;
    } else if (facingBack > 0.65) {
        t = frontFaceBlend(facingBack);
        onFront = false;
    }

    if (t <= 0) {
        resetDirectLights();
        return;
    }

    const keyCut = STUDIO.frontKeyCut != null ? STUDIO.frontKeyCut : 0.42;
    const fillCut = STUDIO.frontFillCut != null ? STUDIO.frontFillCut : 0.62;
    keyLight.intensity = baseKey * (1 - keyCut * t);
    fillLight.intensity = baseFill * (1 - fillCut * t);

    if (onFront) {

        rakeLight.intensity = STUDIO.rakeB * (1 - 0.35 * t);
        const cross = (STUDIO.frontCross != null ? STUDIO.frontCross : 1.05) * t;

function scanAlphaBBox(canvas) {
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const { width: W, height: H } = canvas;
    const d = ctx.getImageData(0, 0, W, H).data;
    let minX = W, minY = H, maxX = -1, maxY = -1;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        if (d[(y * W + x) * 4 + 3] > 100) {
            if (x < minX) minX = x; if (x > maxX) maxX = x;
            if (y < minY) minY = y; if (y > maxY) maxY = y;
        }
    }
    return { minX, minY, maxX, maxY };
}

function contoursFromCanvas(canvas) {
    // Marching squares con interpolacion subpixel: los cruces de borde se interpolan
    // en el campo alfa (umbral 128), de modo que rectas salen rectas y curvas suaves
    // en vez de escalones de 1 pixel. Recorrido con relleno a la derecha (misma
    // convencion de orientacion que el trazador original: exterior positivo).
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const Wp = canvas.width, Hp = canvas.height;
    const img = ctx.getImageData(0, 0, Wp, Hp).data;
    const W = Wp + 2, H = Hp + 2;
    const a = new Float32Array(W * H); // campo con borde de 0
    for (let y = 0; y < Hp; y++) for (let x = 0; x < Wp; x++)
        a[(y + 1) * W + (x + 1)] = img[(y * Wp + x) * 4 + 3];
    const T = 128;
    const at = (x, y) => a[y * W + x];
    const cross = (v0, v1) => { const d = v1 - v0; return d === 0 ? 0.5 : Math.min(1, Math.max(0, (T - v0) / d)); };
    const segs = [];
    for (let y = 0; y < H - 1; y++) for (let x = 0; x < W - 1; x++) {
        const vTL = at(x, y), vTR = at(x + 1, y), vBR = at(x + 1, y + 1), vBL = at(x, y + 1);
        const idx = (vTL >= T ? 8 : 0) | (vTR >= T ? 4 : 0) | (vBR >= T ? 2 : 0) | (vBL >= T ? 1 : 0);
        if (idx === 0 || idx === 15) continue;
        const pT = [x + cross(vTL, vTR), y], pB = [x + cross(vBL, vBR), y + 1];
        const pL = [x, y + cross(vTL, vBL)], pR = [x + 1, y + cross(vTR, vBR)];
        const vC = (vTL + vTR + vBR + vBL) / 4;
        let pairs = null;
        switch (idx) {
            case 8:  pairs = [[pT, pL]]; break;
            case 4:  pairs = [[pT, pR]]; break;
            case 2:  pairs = [[pR, pB]]; break;
            case 1:  pairs = [[pB, pL]]; break;
            case 12: case 3: pairs = [[pL, pR]]; break;
            case 6:  case 9: pairs = [[pT, pB]]; break;
            case 7:  pairs = [[pT, pL]]; break;
            case 11: pairs = [[pT, pR]]; break;
            case 13: pairs = [[pR, pB]]; break;
            case 14: pairs = [[pB, pL]]; break;
            case 5:  pairs = vC >= T ? [[pT, pL], [pR, pB]] : [[pT, pR], [pB, pL]]; break;
            case 10: pairs = vC >= T ? [[pT, pR], [pB, pL]] : [[pT, pL], [pR, pB]]; break;
        }
        if (!pairs) continue;
        for (const [P, Q] of pairs) {
            // orientar con relleno a la derecha: normal derecha (-dy, dx) hacia el relleno
            const dx = Q[0] - P[0], dy = Q[1] - P[1];
            const nx = -dy, ny = dx;
            // esquina rellena y vacia de referencia dentro de la celda
            const corners = [[x, y, vTL], [x + 1, y, vTR], [x + 1, y + 1, vBR], [x, y + 1, vBL]];
            let f = null, e = null;
            for (const c of corners) { if (c[2] >= T) { if (!f || c[2] > f[2]) f = c; } else if (!e || c[2] < e[2]) e = c; }
            if (!f || !e) { segs.push([P, Q]); continue; }
            const dF = nx * (f[0] - Q[0]) + ny * (f[1] - Q[1]);
            const dE = nx * (e[0] - Q[0]) + ny * (e[1] - Q[1]);
            segs.push(dF >= dE ? [P, Q] : [Q, P]);
        }
    }
    // enlazar segmentos dirigidos en lazos cerrados
    const key = (p) => Math.round(p[0] * 16) + '|' + Math.round(p[1] * 16);
    const startMap = new Map();
    segs.forEach((sg, i) => { const k = key(sg[0]); if (!startMap.has(k)) startMap.set(k, []); startMap.get(k).push(i); });
    const used = new Uint8Array(segs.length);
    const contours = [];
    for (let i = 0; i < segs.length; i++) {
        if (used[i]) continue;
        const loop = [];
        let cur = i, guard = 0;
        while (cur !== undefined && !used[cur] && guard < segs.length) {
            used[cur] = 1;
            const sg = segs[cur];
            loop.push(sg[0]);
            const cands = startMap.get(key(sg[1])) || [];
            let nxt;
            for (const ci of cands) if (!used[ci]) { nxt = ci; break; }
            cur = nxt;
            guard++;
        }
        if (loop.length > 3) contours.push(loop);
    }
    return contours;
}

function distToSeg(p, a, b) {
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const l2 = dx * dx + dy * dy;
    if (l2 === 0) return Math.hypot(p[0] - a[0], p[1] - a[1]);
    let t = ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / l2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(p[0] - (a[0] + t * dx), p[1] - (a[1] + t * dy));
}

function rdp(pts, eps) {
    if (pts.length < 3) return pts;
    let maxD = 0, idx = 0;
    const a = pts[0], b = pts[pts.length - 1];
    for (let i = 1; i < pts.length - 1; i++) {
        const d = distToSeg(pts[i], a, b);
        if (d > maxD) { maxD = d; idx = i; }
    }
    if (maxD > eps) {
        const l = rdp(pts.slice(0, idx + 1), eps);
        const r = rdp(pts.slice(idx), eps);
        return l.slice(0, -1).concat(r);
    }
    return [pts[0], pts[pts.length - 1]];
}

function simplifyLoop(pts, eps) {
    const p = pts.filter((q, i) => i === 0 || q[0] !== pts[i - 1][0] || q[1] !== pts[i - 1][1]);
    if (p.length < 4) return p;
    let bi = 0, bj = 1, bd = -1;
    for (let i = 0; i < p.length; i++) for (let j = i + 1; j < p.length; j++) {
        const d = (p[i][0] - p[j][0]) ** 2 + (p[i][1] - p[j][1]) ** 2;
        if (d > bd) { bd = d; bi = i; bj = j; }
    }
    const c1 = rdp(p.slice(bi).concat(p.slice(0, bj + 1)), eps);
    const c2 = rdp(p.slice(bj).concat(p.slice(0, bi + 1)), eps);
    return c1.slice(0, -1).concat(c2.slice(0, -1));
}

function signedArea(pts) {
    let s = 0;
    for (let i = 0; i < pts.length; i++) {
        const a = pts[i], b = pts[(i + 1) % pts.length];
        s += a[0] * b[1] - b[0] * a[1];
    }
    return s / 2;
}

function buildBackShapes(contours, cx, cy, s) {
    // Clasificar exterior/hueco en coordenadas CANVAS (y-abajo): las letras y la línea
    // dan contornos de área positiva; los contadores (huecos) dan área negativa.
    const canv = contours.map(c => ({ c, a: signedArea(c) }));
    const outers = canv.filter(p => p.a > 0).map(p => ({ pts: p.c, holes: [] }));
    const holes = canv.filter(p => p.a <= 0).map(p => p.c);
    // asignar cada hueco al exterior más pequeño que lo contiene (bbox en canvas)
    for (const h of holes) {
        const pt = h[0];
        let best = null;
        for (const o of outers) {
            let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
            for (const q of o.pts) { if (q[0] < minX) minX = q[0]; if (q[0] > maxX) maxX = q[0]; if (q[1] < minY) minY = q[1]; if (q[1] > maxY) maxY = q[1]; }
            if (pt[0] >= minX && pt[0] <= maxX && pt[1] >= minY && pt[1] <= maxY) {
                if (!best || (maxX - minX) < best.w) best = { o, w: maxX - minX };
            }
        }
        if (best) best.o.holes.push(h);
    }
    const conv = (c) => simplifyLoop(c, 0.4).map(p => [(p[0] - cx) * s, -(p[1] - cy) * s]);
    const shapes = [];
    for (const o of outers) {
        const pts = conv(o.pts);
        const shape = new THREE.Shape();
        pts.forEach((p, i) => (i === 0 ? shape.moveTo(p[0], p[1]) : shape.lineTo(p[0], p[1])));
        for (const h of o.holes) {
            const hp = conv(h);
            const path = new THREE.Path();
            hp.forEach((p, i) => (i === 0 ? path.moveTo(p[0], p[1]) : path.lineTo(p[0], p[1])));
            shape.holes.push(path);
        }
        shapes.push(shape);
    }
    return shapes;
}

function formatToday() {
    const d = new Date();
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    return dd + ' · ' + mm + ' · ' + d.getFullYear();

// Dibuja `text` en arco. top=true → arco en la parte SUPERIOR (centrado en 270°);
// top=false → parte INFERIOR (centrado en 90°). spacing = separación extra entre
// caracteres en fracción del tamaño de fuente.
function drawArcText(canvas, size, family, text, radiusUnit, arcDeg, spacing, top) {
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const cx = canvas.width / 2, cy = canvas.height / 2;
    const R = radiusUnit * (canvas.width / 2);
    ctx.fillStyle = '#fff';
    ctx.font = '600 ' + size + 'px ' + family;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const chars = [...text];
    // ancho efectivo por carácter incluyendo la separación extra
    const adv = chars.map(ch => ctx.measureText(ch).width + spacing * size);
    const total = adv.reduce((a, b) => a + b, 0);
    const arcRad = arcDeg * Math.PI / 180;
    const tC = (top ? 270 : 90) * Math.PI / 180;   // ángulo central del arco
    // en canvas (y crece hacia abajo): arco superior va de izquierda (tC-arc/2) a
    // derecha (tC+arc/2); arco inferior al revés (tC+arc/2 → tC-arc/2)
    const t0 = top ? tC - arcRad / 2 : tC + arcRad / 2;
    const t1 = top ? tC + arcRad / 2 : tC - arcRad / 2;
    let acc = 0;
    for (let i = 0; i < chars.length; i++) {
        const frac = (acc + adv[i] / 2) / total;
        const t = t0 + (top ? 1 : -1) * frac * (t0 < t1 ? t1 - t0 : t0 - t1);
        const x = cx + R * Math.cos(t);
        const y = cy + R * Math.sin(t);
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(top ? t + Math.PI / 2 : t - Math.PI / 2); // letras de pie al centro
        ctx.fillText(chars[i], 0, 0);
        ctx.restore();
        acc += adv[i];
    }
}
// Construye el mesh grabado de un texto en arco y lo asigna a `mesh`.
function buildArcMesh(mesh, text, opts) {
    const { radius, arcDeg, spacing, top, sizeScale = 1, back = false } = opts;
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = BACK_CANVAS;
    const R = radius * (canvas.width / 2);
    const arcLen = R * (arcDeg * Math.PI / 180) * 0.94;
    const ctx0 = canvas.getContext('2d', { willReadFrequently: true });
    let size = 170;
    for (let t = 0; t < 20; t++) {
        ctx0.font = '600 ' + size + 'px ' + brandFamily;
        let w = 0; for (const ch of text) w += ctx0.measureText(ch).width + spacing * size;
        if (w <= arcLen) break;
        size *= arcLen / w;
    }
    size *= sizeScale;
    drawArcText(canvas, size, brandFamily, text, radius, arcDeg, spacing, top);
    const bbox = scanAlphaBBox(canvas);
    if (bbox.maxX < 0) return;
    const contours = contoursFromCanvas(canvas);
    const shapes = buildBackShapes(contours, canvas.width / 2, canvas.height / 2, 1 / (canvas.width / 2));
    if (!shapes.length) return;
    const geo = new THREE.ExtrudeGeometry(shapes, {
        depth: 0.008,
        bevelEnabled: true,
        bevelThickness: 0.005,
        bevelSize: 0.003,
        bevelSegments: 6,
        curveSegments: 12
    });
    if (back) {
        // Reverso: espejo (X,Z) como hacía el AWAKE central original: al mirar la
        // moneda por el reverso la lectura queda invertida; -1 en X la compensa y
        // -1 en Z orienta el relieve hacia la cara trasera.
        geo.applyMatrix4(new THREE.Matrix4().makeScale(-1, 1, -1));
    }
    geo.computeVertexNormals();
    geo.computeBoundingBox();
    geo.translate(0, 0, -geo.boundingBox.min.z); // base en z=0 local
    bakeReliefAO(geo, reliefAOStrength(), 0.54);
    if (mesh.geometry) mesh.geometry.dispose();
    mesh.geometry = geo;
    mesh.material = coinReliefMaterial;
    mesh.position.z = back
        ? coinFaceZAtRadius(radius, false) - BACK_ARC_PROTRUDE
        : coinFaceZAtRadius(radius, true) - RELIEF_FACE_INSET;
    mesh.visible = true;
    return { text, verts: geo.attributes.position.count, shapes: shapes.length };
}

coinGroup.add(coin, glyph, voidRing, dateGrab, topBrand);
scene.add(coinGroup);

// ---------- Panel de estudio en vivo ----------
let coinPresets = null;

const VIEW_PRESETS = {
    front: { az: 0, polar: 90, dist: 5.0 },
    back: { az: 180, polar: 90, dist: 5.0 },
    edge: { az: 45, polar: 72, dist: 5.2 },
    default: { az: 45, polar: 75, dist: 5.0 }
};

function setViewPreset(name) {
    const p = VIEW_PRESETS[name] || VIEW_PRESETS.default;
    const polar = THREE.MathUtils.degToRad(p.polar);
    const az = THREE.MathUtils.degToRad(p.az);
    camera.position.set(
        p.dist * Math.sin(polar) * Math.sin(az),
        p.dist * Math.cos(polar),
        p.dist * Math.sin(polar) * Math.cos(az)
    );
    camera.lookAt(0, 0, 0);
    controls.update();
}

function studioExportJson() {
    return JSON.stringify({
        metalIndex,
        metal: METALS[metalIndex].id,
        envMode,
        studio: Object.assign({}, STUDIO)
    }, null, 2);
}

function syncStudioPanelValues() {
    const map = [
        ['sl-exposure', 'exposure', 'val-exposure'],
        ['sl-envMul', 'envMul', 'val-envMul'],
        ['sl-frontBoost', 'frontBoost', 'val-frontBoost'],
        ['sl-key', 'key', 'val-key'],
        ['sl-fill', 'fill', 'val-fill'],
        ['sl-rakeF', 'rakeF', 'val-rakeF'],
        ['sl-rakeB', 'rakeB', 'val-rakeB'],
        ['sl-rim', 'rim', 'val-rim'],
        ['sl-lightAz', 'lightAz', 'val-lightAz'],
        ['sl-lightEl', 'lightEl', 'val-lightEl'],
        ['sl-fieldRoughnessMul', 'fieldRoughnessMul', 'val-fieldRoughnessMul'],
        ['sl-reliefRoughnessMul', 'reliefRoughnessMul', 'val-reliefRoughnessMul'],
        ['sl-reliefEnvMul', 'reliefEnvMul', 'val-reliefEnvMul'],
        ['sl-reliefAO', 'reliefAO', 'val-reliefAO'],
        ['sl-shadowOpacity', 'shadowOpacity', 'val-shadowOpacity'],
        ['sl-frontEnvCut', 'frontEnvCut', 'val-frontEnvCut']
    ];
    map.forEach(([slId, key, valId]) => {
        const sl = document.getElementById(slId);
        const val = document.getElementById(valId);
        if (sl && STUDIO[key] != null) sl.value = STUDIO[key];
        if (val && STUDIO[key] != null) val.textContent = Number(STUDIO[key]).toFixed(2);
    });
    const ckShadow = document.getElementById('ck-shadow');
    const ckAdapt = document.getElementById('ck-viewAdaptive');
    if (ckShadow) ckShadow.checked = STUDIO.shadow;
    if (ckAdapt) ckAdapt.checked = STUDIO.viewAdaptive;
}

function rebuildAllReliefs() {
    setSection(section);
    rebuildVoidRing();
    buildDateGrab();
    buildTopBrand();
    syncReliefHeightsToCoinFace();
}

function onStudioSlider(key, value, needsEnvRebuild) {
    STUDIO[key] = value;
    if (needsEnvRebuild) rebuildEnvironment();
    else if (key === 'reliefAO') rebuildAllReliefs();
    else if (key.startsWith('fieldRough') || key.startsWith('reliefRough') || key.startsWith('reliefEnv')) applyMetal(metalIndex);
    else applyStudio();
}

async function loadCoinPresets() {
    try {
        const res = await fetch('./coin-presets.json');
        if (res.ok) coinPresets = await res.json();
    } catch (e) { coinPresets = null; }
}

function applyMetalPreset() {
    if (!coinPresets || !coinPresets.metals) return;
    const id = METALS[metalIndex].id;
    const p = coinPresets.metals[id];
    if (coinPresets.defaults) Object.assign(STUDIO, coinPresets.defaults);
    if (p && p.studio) Object.assign(STUDIO, p.studio);
    syncStudioPanelValues();
    rebuildEnvironment();
    applyMetal(metalIndex);
    rebuildAllReliefs();
}

function initStudioPanel() {
    const panel = document.getElementById('studio-panel');
    const toggle = document.getElementById('studio-toggle');
    toggle.addEventListener('click', () => {
        const open = panel.classList.toggle('open');
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });

    document.querySelectorAll('[data-view]').forEach(btn => {
        btn.addEventListener('click', () => setViewPreset(btn.dataset.view));
    });

    document.querySelectorAll('#env-mode-btns [data-env]').forEach(btn => {
        btn.addEventListener('click', () => {
            envMode = btn.dataset.env;
            document.querySelectorAll('#env-mode-btns .st-btn').forEach(b =>
                b.classList.toggle('active', b.dataset.env === envMode));
            rebuildEnvironment();
        });
    });


    const sliders = [
        ['sl-exposure', 'exposure', false],
        ['sl-envMul', 'envMul', false],
        ['sl-frontBoost', 'frontBoost', true],
        ['sl-key', 'key', false],
        ['sl-fill', 'fill', false],
        ['sl-rakeF', 'rakeF', false],
        ['sl-rakeB', 'rakeB', false],
        ['sl-rim', 'rim', false],
        ['sl-lightAz', 'lightAz', false],
        ['sl-lightEl', 'lightEl', false],
        ['sl-fieldRoughnessMul', 'fieldRoughnessMul', false],
        ['sl-reliefRoughnessMul', 'reliefRoughnessMul', false],
        ['sl-reliefEnvMul', 'reliefEnvMul', false],
        ['sl-reliefAO', 'reliefAO', false],
        ['sl-shadowOpacity', 'shadowOpacity', false],
        ['sl-frontEnvCut', 'frontEnvCut', false]
    ];
    sliders.forEach(([id, key, envRebuild]) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('input', () => onStudioSlider(key, parseFloat(el.value), envRebuild));
    });

    document.getElementById('ck-shadow')?.addEventListener('change', e => {
        STUDIO.shadow = e.target.checked;
        applyStudio();
    });
    document.getElementById('ck-viewAdaptive')?.addEventListener('change', e => {
        STUDIO.viewAdaptive = e.target.checked;
        applyStudio();
    });

    document.getElementById('btn-copy-json')?.addEventListener('click', async () => {
        const json = studioExportJson();
        const status = document.getElementById('studio-copy-status');
        try {
            await navigator.clipboard.writeText(json);
            if (status) status.textContent = 'JSON copiado al portapapeles';
        } catch (e) {
            if (status) status.textContent = json.slice(0, 80) + '…';
        }
    });

    document.getElementById('btn-load-preset')?.addEventListener('click', () => applyMetalPreset());

    syncStudioPanelValues();
    loadCoinPresets().then(() => {
        if (coinPresets) applyMetalPreset();
    });
}

function bootCoinScene() {
    rebuildEnvironment();
    applyMetal(metalIndex);
    setSection('sello');
    initStudioPanel();
    syncReliefHeightsToCoinFace();
    rebuildAllReliefs();
}

bootCoinScene();

// ---------- Exportación .glb (aviso 4: formato web optimizado) ----------
// Exporta SOLO las piezas de la moneda (cuerpo + glifo + AWAKE), sin la utilería
// del estudio (eje, peana, sombra, luces). Transforms limpios en el .glb:
//   - cuerpo:  identidad (buildCoinSolid genera en unidades reales)
//   - glifo:   posición z=0.0695 — su escala s (no uniforme) ya está HORNEADA en
//              la geometría (applyMatrix4 en buildGlyph) → nodo sin escala rara
//   - AWAKE:   posición z=-0.093 — su espejo -1,1,-1 ya está horneado en la geometría
const gltfExporter = new GLTFExporter();
const gltfLoader = new GLTFLoader();
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('./js/vendor/draco/');

async function exportGLB() {
    // Esperar a que los relieves async estén construidos (fuente cargando).
    for (let i = 0; i < 50 && !(voidRingGeo && dateGrab.geometry && dateGrab.geometry.attributes.position
        && topBrand.geometry && topBrand.geometry.attributes.position); i++) {
        await new Promise(r => setTimeout(r, 100));
    }
    const exportScene = new THREE.Scene();
    exportScene.add(coin.clone(false), glyph.clone(false), voidRing.clone(false), dateGrab.clone(false), topBrand.clone(false));
    const glb = await new Promise((res, rej) =>
        gltfExporter.parse(exportScene, res, rej, { binary: true }));
    // Guardar también en disco (dev): proto/out/awake-coin.glb para el
    // post-proceso (compresión Draco). Silencioso; no afecta a producción.
    try { await fetch('/__save/awake-coin.glb', { method: 'POST', body: glb }); } catch (e) {}
    const blob = new Blob([glb], { type: 'model/gltf-binary' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'awake-coin.glb'; a.click();
    URL.revokeObjectURL(url);
    return glb;
}

// Verificación round-trip (aviso 4): recarga el .glb con GLTFLoader y lo muestra
// en el MISMO estudio; permite comparar por píxeles con el render procedural.
// opts.draco=true usa DRACOLoader (decoder vendored) para validar la variante
// comprimida con KHR_draco_mesh_compression.
function verifyGLB(glb, opts) {
    const useDraco = !!(opts && opts.draco);
    const loader = useDraco
        ? (() => { const l = new GLTFLoader(); l.setDRACOLoader(dracoLoader); return l; })()
        : gltfLoader;
    return new Promise((resolve, reject) => {
        loader.parse(glb, '', (gltf) => {
            const loaded = gltf.scene;
            const info = { meshes: [], totalTris: 0, totalVerts: 0 };
            loaded.traverse(o => {
                if (o.isMesh) {
                    const g = o.geometry;
                    const t = g.index ? g.index.count / 3 : g.attributes.position.count / 3;
                    info.meshes.push({ name: o.name || '(sin nombre)', tris: Math.round(t) });
                    info.totalTris += t;
                    info.totalVerts += g.attributes.position.count;
                }
            });
            // Ocultar la moneda procedural y mostrar la cargada del .glb
            const prevVis = {
                coin: coin.visible, glyph: glyph.visible, ring: voidRing.visible,
                date: dateGrab.visible, top: topBrand.visible
            };
            coin.visible = false; glyph.visible = false; voidRing.visible = false;
            dateGrab.visible = false; topBrand.visible = false;
            const glbGroup = new THREE.Group();
            glbGroup.add(loaded);
            scene.add(glbGroup);
            let matInfo = null;
            loaded.traverse(o => {
                if (o.isMesh && !matInfo) {
                    const m = o.material;
                    matInfo = {
                        type: m.type,
                        metalness: m.metalness,
                        roughness: m.roughness,
                        color: '#' + m.color.getHexString(),
                        doubleSided: m.side === THREE.DoubleSide
                    };
                }
            });
            window.__glbTest = { group: glbGroup, prevVis, info, matInfo };
            resolve({ info, matInfo, bytes: glb.byteLength, draco: useDraco });
        }, reject);
    });
}

// Verifica la variante comprimida guardada en disco (proto/out/awake-coin-draco.glb).
async function verifyGLBDraco() {
    const res = await fetch('/proto/out/awake-coin-draco.glb');
    if (!res.ok) throw new Error('No existe el .glb Draco en disco: ' + res.status);
    const buf = await res.arrayBuffer();
    return verifyGLB(buf, { draco: true });
}

function restoreGLBTest() {
    const t = window.__glbTest;
    if (!t) return 'sin test activo';
    scene.remove(t.group);
    t.group.traverse(o => { if (o.isMesh) { o.geometry.dispose(); if (o.material) o.material.dispose(); } });
    coin.visible = t.prevVis.coin; glyph.visible = t.prevVis.glyph; voidRing.visible = t.prevVis.ring;
    dateGrab.visible = t.prevVis.date; topBrand.visible = t.prevVis.top;
    window.__glbTest = null;
    return 'restaurado';
}

document.getElementById('export').addEventListener('click', async () => {
    const btn = document.getElementById('export');
    btn.disabled = true;
    try {
        const glb = await exportGLB();
        console.log('GLB exportado: ' + (glb.byteLength / 1024).toFixed(1) + ' KB (binario, 1 solo archivo)');
    } catch (e) { console.error('Error al exportar .glb', e); }
    btn.disabled = false;
});

// ---------- Resize ----------
function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
}
window.addEventListener('resize', resize);

// ---------- Hook de depuración (fase de diseño) ----------
window.__coin3d = { camera, controls, scene, coin, glyph, voidRing, voidRingGeo, rebuildVoidRing, dateGrab, topBrand, setDateGrab, renderer, applyMetal, applyStudio, STUDIO, rebuildEnvironment, setViewPreset, METALS, setSection, GLYPHS, THREE, COIN_RELIEF, COIN_CFG, rebuildCoinGeometry, coinGroup, exportGLB, verifyGLB, verifyGLBDraco, restoreGLBTest, gltfExporter, debugBack: { contoursFromCanvas, buildBackShapes, scanAlphaBBox, drawBrand, BACK_TARGET_W, BACK_CANVAS } };

// ---------- Bucle ----------
renderer.setAnimationLoop(() => {
    const now = performance.now();
    const dt = Math.min((now - lastT) / 1000, 0.05);   // dt acotado
    lastT = now;
    if (coinSpinning) coinGroup.rotation.y += COIN_SPIN * dt;
    applyViewAdaptiveLighting();
    controls.update();
    renderer.render(scene, camera);
});
